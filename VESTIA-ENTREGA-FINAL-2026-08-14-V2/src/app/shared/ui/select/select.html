<label class="block space-y-2">
  <span class="text-sm font-medium text-[var(--color-text)]">{{ label }}</span>
  <select class="w-full rounded-2xl border border-[var(--color-border)] bg-white px-4 py-3 text-sm outline-none transition focus:border-[var(--color-primary)]">
    @for (option of options; track option.value) {
      <option [value]="option.value">{{ option.label }}</option>
    }
  </select>
</label>
