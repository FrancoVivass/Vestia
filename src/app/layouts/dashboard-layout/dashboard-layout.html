<div class="min-h-screen lg:grid lg:grid-cols-[280px_1fr]">
  <aside class="hidden border-r border-[var(--color-border)] bg-[var(--color-surface)] lg:block">
    <app-sidebar />
  </aside>

  @if (navigation.sidebarOpen()) {
    <div class="fixed inset-0 z-40 bg-black/30 lg:hidden" (click)="navigation.closeSidebar()">
      <div
        class="h-full w-[280px] bg-[var(--color-surface)] shadow-xl slide-up"
        (click)="$event.stopPropagation()"
      >
        <app-sidebar />
      </div>
    </div>
  }

  <section class="flex min-h-screen flex-col p-4 md:p-6">
    <app-header />

    <main class="mt-6 flex-1">
      <router-outlet />
    </main>

    <footer class="mt-8 border-t border-[var(--color-border)] pt-4 text-center text-xs text-[var(--color-muted)]">
      © 2026 VESTIA · Todos los derechos reservados · VivasFranco.dev
    </footer>
  </section>
</div>

<div class="floating-actions" aria-label="Acciones rápidas">
  <button type="button" class="floating-button theme-button" (click)="theme.toggle()" [attr.aria-label]="theme.dark()?'Activar modo claro':'Activar modo oscuro'" [title]="theme.dark()?'Modo claro':'Modo oscuro'">
    @if(theme.dark()){<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41"></path></svg>}@else{<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"></path></svg>}
  </button>
  <a class="floating-button whatsapp-button" href="https://wa.me/542245421367?text=Hola%2C%20quiero%20informaci%C3%B3n%20sobre%20VESTIA" target="_blank" rel="noopener noreferrer" aria-label="Contactar a VESTIA por WhatsApp" title="WhatsApp: +54 2245 421367">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 3.5A11.8 11.8 0 0 0 12.1 0C5.6 0 .3 5.3.3 11.8c0 2.1.6 4.2 1.6 6L.2 24l6.4-1.7a11.7 11.7 0 0 0 5.5 1.4h.1c6.5 0 11.8-5.3 11.8-11.8 0-3.2-1.2-6.2-3.5-8.4ZM12.2 21.7h-.1a9.8 9.8 0 0 1-5-1.4l-.4-.2-3.8 1 1-3.7-.2-.4a9.8 9.8 0 1 1 8.5 4.7Zm5.4-7.3c-.3-.1-1.8-.9-2-.9-.3-.1-.5-.1-.7.2-.2.3-.8.9-1 1.1-.2.2-.4.2-.7.1-1.8-.9-3-1.6-4.2-3.7-.3-.6.3-.5.9-1.7.1-.2 0-.4 0-.6l-.9-2.1c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.6.1-.9.4-.3.3-1.2 1.2-1.2 2.9s1.3 3.4 1.4 3.6c.2.2 2.5 3.8 6 5.3.8.4 1.5.6 2 .7.8.3 1.6.2 2.2.1.7-.1 1.8-.7 2-1.4.3-.7.3-1.3.2-1.4-.1-.1-.3-.2-.6-.3Z"></path></svg>

</div>
