@if (open) {
  <div class="fixed inset-0 z-50 flex items-center justify-center overflow-hidden bg-black/30 p-2 sm:p-4 fade-in" (click)="close()">
    <div
      class="flex max-h-[calc(100dvh-1rem)] w-full flex-col overflow-hidden rounded-[1.25rem] border border-[var(--color-border)] bg-[var(--color-surface)] p-4 shadow-2xl scale-in sm:max-h-[calc(100dvh-2rem)] sm:rounded-[2rem] sm:p-6"
      [class.max-w-lg]="!wide"
      [class.max-w-5xl]="wide"
      (click)="$event.stopPropagation()"
    >
      <div class="mb-4 flex shrink-0 items-start justify-between gap-4">
        <div>
          <h3 class="text-xl font-semibold">{{ title }}</h3>
          <p class="mt-2 text-sm leading-6 text-[var(--color-muted)]">{{ description }}</p>
        </div>

        <button type="button" class="text-lg" (click)="close()">✕</button>
      </div>

      <div class="min-h-0 flex-1 overflow-y-auto overscroll-contain pr-1">
        <ng-content />
      </div>

      <div class="mt-4 flex shrink-0 justify-end gap-3 border-t border-[var(--color-border)] pt-4 sm:mt-6">
        <button
          type="button"
          class="rounded-2xl border border-[var(--color-border)] px-4 py-2 text-sm font-medium"
          (click)="close()"
        >
          {{ cancelLabel }}
        </button>
        <button
          type="button"
          class="rounded-2xl bg-[var(--color-primary)] px-4 py-2 text-sm font-semibold text-white"
          (click)="confirm()"
          [disabled]="loading"
        >
          {{ loading ? 'Procesando...' : confirmLabel }}
        </button>
      </div>
    </div>
  </div>
}
