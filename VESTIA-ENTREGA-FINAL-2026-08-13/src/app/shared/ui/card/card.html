<article class="surface-card hover-lift p-5">
  <div class="mb-4 flex items-start justify-between gap-3">
    <div>
      <h3 class="text-lg font-semibold text-[var(--color-text)]">{{ title }}</h3>
      @if (description) {
        <p class="mt-2 text-sm leading-6 text-[var(--color-muted)]">{{ description }}</p>
      }
    </div>
    <ng-content />
  </div>
</article>
