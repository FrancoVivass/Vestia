<div class="inline-flex flex-wrap gap-2 rounded-[1.5rem] border border-[var(--color-border)] bg-white p-2">
  @for (item of items; track item) {
    <button
      type="button"
      class="rounded-xl px-4 py-2 text-sm font-medium text-[var(--color-text)] transition hover:bg-[var(--color-background)]"
    >
      {{ item }}
    </button>
  }
</div>
