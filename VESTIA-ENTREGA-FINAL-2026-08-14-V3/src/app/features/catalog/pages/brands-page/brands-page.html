<section class="space-y-6">
  <div class="flex items-center justify-between gap-4">
    <div>
      <p class="text-sm uppercase tracking-[0.18em] text-[var(--color-muted)]">Marcas</p>
      <h2 class="mt-2 text-3xl font-semibold">Gestión de marcas</h2>
    </div>
    <app-button label="Nueva marca" (buttonClick)="openCreate()" />
  </div>

  @if (!brands().length) {
    <div class="surface-card p-8 text-center">
      <p class="text-lg font-semibold">Todavía no hay marcas</p>
      <p class="mt-3 text-sm text-[var(--color-muted)]">Creá la primera marca para enriquecer tu catálogo.</p>
    </div>
  } @else {
    <div class="grid gap-4 md:grid-cols-2 xl:grid-cols-3">
      @for (brand of brands(); track brand.id) {
        <article class="surface-card p-5">
          <div class="flex items-center justify-between gap-3">
            <h3 class="text-lg font-semibold">{{ brand.name }}</h3>
            <app-badge [label]="brand.status === 'active' ? 'Activo' : 'Inactivo'" [variant]="brand.status === 'active' ? 'success' : 'warning'" />
          </div>
          <p class="mt-3 text-sm text-[var(--color-muted)]">{{ brand.description }}</p>
          <p class="mt-4 text-xs uppercase tracking-[0.14em] text-[var(--color-muted)]">Creado: {{ brand.createdAt | date: 'dd/MM/yyyy' }}</p>
          <div class="mt-4 flex gap-3">
            <button type="button" class="rounded-2xl border border-[var(--color-border)] px-4 py-2 text-sm" (click)="openEdit(brand)">Editar</button>
            <button type="button" class="rounded-2xl border border-[var(--color-border)] px-4 py-2 text-sm" (click)="toggleStatus(brand)">{{ brand.status === 'active' ? 'Desactivar' : 'Activar' }}</button>
          </div>
        </article>
      }
    </div>
  }

  <app-brand-form-modal [open]="modalOpen()" [brand]="editing()" (closed)="closeModal()" (saved)="saveBrand($event)" />
</section>
