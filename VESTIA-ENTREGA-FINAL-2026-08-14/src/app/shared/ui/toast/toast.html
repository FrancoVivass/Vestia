<div class="pointer-events-none fixed right-4 top-4 z-[60] flex w-full max-w-sm flex-col gap-3">
  @for (item of toast.items(); track item.id) {
    <div class="pointer-events-auto rounded-[1.5rem] border border-[var(--color-border)] bg-[var(--color-surface)] p-4 shadow-xl fade-in">
      <div class="flex items-start justify-between gap-3">
        <div>
          <p class="text-sm font-semibold text-[var(--color-text)]">{{ item.title }}</p>
          @if (item.description) {
            <p class="mt-1 text-sm leading-6 text-[var(--color-muted)]">{{ item.description }}</p>
          }
        </div>
        <button type="button" class="text-sm" (click)="toast.dismiss(item.id)">✕</button>
      </div>
    </div>
  }
</div>
