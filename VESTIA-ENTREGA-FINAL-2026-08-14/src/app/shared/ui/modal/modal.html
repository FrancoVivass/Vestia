@if (open) {
  <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/30 p-4 fade-in" (click)="close()">
    <div
      class="w-full max-w-lg rounded-[2rem] border border-[var(--color-border)] bg-[var(--color-surface)] p-6 shadow-2xl scale-in"
      (click)="$event.stopPropagation()"
    >
      <div class="mb-4 flex items-start justify-between gap-4">
        <div>
          <h3 class="text-xl font-semibold">{{ title }}</h3>
          <p class="mt-2 text-sm leading-6 text-[var(--color-muted)]">{{ description }}</p>
        </div>

        <button type="button" class="text-lg" (click)="close()">✕</button>
      </div>

      <div class="mt-6 flex justify-end gap-3">
        <button
          type="button"
          class="rounded-2xl border border-[var(--color-border)] px-4 py-2 text-sm font-medium"
          (click)="close()"
        >
          {{ cancelLabel }}
        </button>
        <button
          type="button"
          class="rounded-2xl bg-[var(--color-primary)] px-4 py-2 text-sm font-semibold text-white"
          (click)="confirm()"
        >
          {{ loading ? 'Procesando...' : confirmLabel }}
        </button>
      </div>
    </div>
  </div>
}
