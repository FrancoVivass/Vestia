<section><header><p>POSVENTA</p><h1>Devoluciones</h1><span>Reposición al propietario y lote originales.</span></header><form (ngSubmit)="search()"><input type="number" name="number" [(ngModel)]="number" placeholder="Número de venta"><button>Buscar venta</button></form>@if(sale()){<article><h2>Venta #{{sale().sale_number}}</h2><p>Estado: {{sale().status}} · Total: $ {{sale().total}}</p><div class="items">@for(item of sale().sale_items;track item.id){@for(a of item.sale_item_allocations;track a.id){<label class="item"><input type="radio" name="allocation" [value]="a.id" [(ngModel)]="allocationId" [disabled]="available(a)<=0"><span><b>{{item.product_variants.products.name}}</b><small>{{item.product_variants.sku}} · {{a.owners.first_name}} {{a.owners.last_name}} · disponible para devolver: {{available(a)}}</small></span></label>}}</div><div class="grid"><label>Cantidad<input type="number" min="1" [(ngModel)]="quantity"></label><label>Motivo<select [(ngModel)]="reason"><option>Devolución</option><option>Cambio</option><option>Defecto</option><option>Error</option><option>Otro</option></select></label><label>Importe a reintegrar<input type="number" min="0" [(ngModel)]="refund"></label>@if(refund>0){<label>Tipo de pago del reintegro<select [(ngModel)]="refundMethodId">@for(method of methods();track method.id){<option [value]="method.id">{{method.name}}</option>}</select></label>}</div><button (click)="submit()">Confirmar devolución</button></article>}</section>
